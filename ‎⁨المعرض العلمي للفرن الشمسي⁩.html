function openSt(id){const s=ST[id];closePart();const d=V(-s.pos.x,0,-s.pos.z).normalize(),dist=s.big?7:5;flyTo(V(s.pos.x+d.x*dist,1.7,s.pos.z+d.z*dist),V(s.pos.x,s.big?2.6:2.2,s.pos.z));$m.innerHTML='<button class="x" onclick="$(\'#modal\').classList.remove(\'on\')">إغلاق ✕</button><h3>المحطة '+s.n+': '+s.t+'</h3>'+(id==='math'?'<div class="tabs" id="tb"></div><div id="tc"></div>':s.html);$m.classList.add('on');if(id==='math')tab(0)}

if(i==1){c.innerHTML='<label>ميل العاكس عن الأفق: <b id="av"></b>°<input type="range" min="60" max="120" value="'+thU+'" id="sl"></label><canvas class="c" id="cv" width="560" height="300"></canvas><p id="o2"></p><div class="f">زاوية السقوط = زاوية الانعكاس</div>';$('#sl').oninput=e=>{thU=+e.target.value;c2()};c2()}
if(i==2){c.innerHTML='<p>أدخلي قراءاتك الفعلية من التجربة (لا توجد بيانات افتراضية):</p><div class="g"><label>الزمن (دقيقة)<input id="tm" type="number" min="0"></label><label>الحرارة (°م)<input id="tp" type="number"></label></div><button id="ad">إضافة قراءة</button> <button id="cl">مسح القراءات</button><canvas class="c" id="cv" width="560" height="280"></canvas><p id="o3"></p>';$('#ad').onclick=()=>{const a=$('#tm').value,b=$('#tp').value;if(a===''||b==='')return;RD.push([+a,+b]);RD.sort((x,y)=>x[0]-y[0]);c3()};$('#cl').onclick=()=>{RD.length=0;c3()};c3()}
if(i==3){const[L,W,H,F]=DIM,g=(a,b)=>b?g(b,a%b):a,k=g(L,W);let h='<p>نسبة الطول إلى العرض = '+L+' : '+W+' = <b>'+L/k+' : '+W/k+'</b></p><p>نسبة مساحة العاكس إلى القاعدة = '+(F*L)+' ÷ '+(L*W)+' = <b>'+(F/W).toFixed(2)+'</b></p><p>نسبة الارتفاع إلى الطول = <b>'+(H/L).toFixed(2)+'</b></p>';if(RD.length>1){const a=RD[0],b=RD[RD.length-1];h+='<p>مقارنة القراءات: آخر حرارة ÷ أول حرارة = '+b[1]+' ÷ '+a[1]+' = <b>'+(a[1]?(b[1]/a[1]).toFixed(2):'—')+'</b></p>'}else h+='<p>أضيفي قراءتين على الأقل في تبويب الإحصاء لمقارنة الحرارة.</p>';c.innerHTML=h}}
function c1(){const[L,W,H,F]=DIM;$('#o1').innerHTML='مساحة القاعدة = '+L+' × '+W+' = <b>'+L*W+'</b> سم²<br>مساحة العاكس = '+L+' × '+F+' = <b>'+L*F+'</b> سم²<br>حجم الحجرة = '+L+' × '+W+' × '+H+' = <b>'+L*W*H+'</b> سم³'}
function geo(a){const r=a*D,n=[Math.sin(r),Math.cos(r)],d=[-Math.cos(e),-Math.sin(e)],dn=d[0]*n[0]+d[1]*n[1],rf=[d[0]-2*dn*n[0],d[1]-2*dn*n[1]],s=.9,p1=[-1.05-s*Math.cos(r),1.55+s*Math.sin(r)],t=rf[1]<-.01?(.76-p1[1])/rf[1]:2,p2=[p1[0]+rf[0]*t,p1[1]+rf[1]*t];return{n,d,rf,p1,p2,i:Math.acos(Math.min(1,-dn))/D,hit:rf[1]<-.01&&Math.abs(p2[0])<.95}}
function c2(){$('#av').textContent=thU;const q=geo(thU),x=$('#cv').getContext('2d'),X=z=>280+z*95,Y=y=>270-y*95;x.clearRect(0,0,560,300);x.strokeStyle='#2bb3ff';x.strokeRect(X(-1.5),Y(1.45),3*95,1.45*95);x.fillStyle='#000';x.fillRect(X(-1.35),Y(.76),2.7*95,5);
const h=[-1.05,1.55],e2=[h[0]-1.8*Math.cos(thU*D),h[1]+1.8*Math.sin(thU*D)];x.lineWidth=5;x.strokeStyle='#dfe9f5';x.beginPath();x.moveTo(X(h[0]),Y(h[1]));x.lineTo(X(e2[0]),Y(e2[1]));x.stroke();x.lineWidth=2;
const ln=(a,b,c,d)=>{x.beginPath();x.moveTo(X(a),Y(b));x.lineTo(X(c),Y(d));x.stroke()};x.strokeStyle='#ffc83d';ln(q.p1[0]-q.d[0]*2.2,q.p1[1]-q.d[1]*2.2,q.p1[0],q.p1[1]);ln(q.p1[0],q.p1[1],q.p2[0],q.p2[1]);x.setLineDash([5,4]);x.strokeStyle='#fff';ln(q.p1[0]-q.n[0]*.8*-1,q.p1[1]+q.n[1]*.8,q.p1[0]-q.n[0]*.4,q.p1[1]-q.n[1]*.4);x.setLineDash([]);
$('#o2').innerHTML='زاوية السقوط = <b>'+q.i.toFixed(1)+'°</b> = زاوية الانعكاس <b>'+q.i.toFixed(1)+'°</b><br>'+(q.hit?'✅ الأشعة المنعكسة تدخل الفرن':'⚠️ الأشعة تخطئ الفرن — عدّلي الميل')}
function c3(){const x=$('#cv').getContext('2d');x.clearRect(0,0,560,280);x.strokeStyle='#789';x.beginPath();x.moveTo(40,10);x.lineTo(40,240);x.lineTo(540,240);x.stroke();x.fillStyle='#9fd8ff';x.font='13px Tahoma';x.fillText('الزمن (د)',480,262);x.fillText('°م',6,20);if(!RD.length){x.fillStyle='#fff';x.fillText('لا توجد قراءات بعد',230,130);$('#o3').textContent='';return}
const mx=Math.max(...RD.map(r=>r[0]),1),my=Math.max(...RD.map(r=>r[1]),1)*1.15,mn=Math.min(0,...RD.map(r=>r[1])),P=r=>[40+r[0]/mx*480,240-(r[1]-mn)/(my-mn)*220];x.strokeStyle='#ffc83d';x.lineWidth=2;x.beginPath();RD.forEach((r,i)=>{const p=P(r);i?x.lineTo(...p):x.moveTo(...p)});x.stroke();RD.forEach(r=>{const p=P(r);x.fillStyle='#2bb3ff';x.beginPath();x.arc(p[0],p[1],4,0,7);x.fill();x.fillStyle='#fff';x.fillText(r[1],p[0]-8,p[1]-8)});
const t=RD.map(r=>r[1]),av=t.reduce((a,b)=>a+b,0)/t.length;$('#o3').innerHTML='أعلى حرارة: <b>'+Math.max(...t)+'</b> °م • المتوسط: <b>'+av.toFixed(1)+'</b>'+(RD.length>1&&RD[RD.length-1][0]>RD[0][0]?' • معدل الارتفاع: <b>'+((t[t.length-1]-t[0])/(RD[RD.length-1][0]-RD[0][0])).toFixed(2)+'</b> °م/د':'')}
// UI
$('#top').innerHTML=Object.values(parts).map(p=>'<button onclick="openPart(\''+p.id+'\')">'+p.name+'</button>').join('')+'<button onclick="resetAll()" style="border-color:#ffc83d">↺ إعادة المجسم</button>';
$('#nav').innerHTML='<button onclick="home()">🏠 البداية</button>'+Object.values(ST).map(s=>'<button onclick="openSt(\''+s.id+'\')"'+(s.big?' style="border-color:#ffc83d;font-weight:bold"':'')+'>'+s.n+' '+s.t+'</button>').join('');
$('#go').onclick=()=>{$('#intro').style.display='none';$('#hud').hidden=false;flyTo(V(0,1.7,13),V(0,1.7,0))};
const km={w:'f',arrowup:'f',s:'b',arrowdown:'b',a:'l',arrowleft:'l',d:'r',arrowright:'r'};
addEventListener('keydown',e=>{const k=km[e.key.toLowerCase()];if(k&&!/INPUT/.test(e.target.tagName)){keys[k]=1;tw=null}});addEventListener('keyup',e=>{const k=km[e.key.toLowerCase()];if(k)keys[k]=0});
document.querySelectorAll('#pad button').forEach(b=>{b.onpointerdown=()=>{keys[b.dataset.k]=1;tw=null};b.onpointerup=b.onpointerleave=()=>keys[b.dataset.k]=0});
const cv=R.domElement,rc=new THREE.Raycaster();let dn=null;
cv.onpointerdown=e=>{dn={x:e.clientX,y:e.clientY,m:0};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;dn.x=e.clientX;dn.y=e.clientY;dn.m+=Math.abs(dx)+Math.abs(dy);if(dn.m>8){tw=null;yaw+=dx*.004;pitch=Math.max(-1.3,Math.min(1.3,pitch+dy*.004))}};
cv.onpointerup=e=>{if(dn&&dn.m<8&&!$('#hud').hidden){rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},C);const h=rc.intersectObjects(pick,false)[0];if(h){const u=h.object.userData;if(u.part)openPart(u.part);else if(u.st)openSt(u.st)}}dn=null};
cv.onwheel=e=>{C.fov=Math.max(25,Math.min(75,C.fov+e.deltaY*.03));C.updateProjectionMatrix()};
// Loop
let t0=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-t0)/1000,.05);t0=now;T+=dt;
if(tw){tw.t=Math.min(1,tw.t+dt/1.4);const k=tw.t<.5?2*tw.t*tw.t:1-Math.pow(-2*tw.t+2,2)/2;C.position.lerpVectors(tw.p0,tw.p1,k);yaw=tw.y0+(tw.y1-tw.y0)*k;pitch=tw.a0+(tw.a1-tw.a0)*k;if(tw.t>=1)tw=null}
else{const f=(keys.f||0)-(keys.b||0),s=(keys.r||0)-(keys.l||0),v=4*dt;C.position.x=Math.max(-18,Math.min(18,C.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*v));C.position.z=Math.max(-18,Math.min(18,C.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*v))}

th=active==='ref'?95+14*Math.sin(T*1.3):thU;piv.rotation.x=th*D;upd(th,T);
abM.emissive.setHex(0xff3300);abM.emissiveIntensity=active==='abs'?.6+.4*Math.sin(T*5):0;
const hv=active==='abs'||active==='cham';hp.forEach(m=>{m.visible=hv;if(hv){const o=m.userData.o,u=(T*.4+o[1])%1;m.position.set(o[0],.8+u*.8,o[2]);m.material.opacity=1-u}});
spin.forEach(o=>o.rotation.y+=dt*.6);glow.emissiveIntensity=.7+.3*Math.sin(T*2);gold.emissiveIntensity=.8+.4*Math.sin(T*3);rg.rotation.z+=dt*.3;sun.scale.setScalar(1+.04*Math.sin(T*2));
R.render(S,C)}
